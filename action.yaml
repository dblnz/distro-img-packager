name: Distro image packager
description: Package pre-built kernel artifacts into a distro image using mkosi

inputs:
  kernel_dir:
    description: Path to the kernel install directory containing boot/ and lib/modules/
    required: true
  output_name:
    description: Base filename for output image (without extension)
    required: false
    default: "image"

outputs:
  image_path:
    description: Path to the generated VHD image file
    value: ${{ steps.paths.outputs.image_vhd }}
  image_raw_path:
    description: Path to the raw disk image
    value: ${{ steps.paths.outputs.image_raw }}

runs:
  using: "composite"
  steps:
    - name: Install image build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y dnf rpm qemu-utils jq distribution-gpg-keys

    - name: Install uv
      shell: bash
      run: |
        if ! command -v uv &>/dev/null && [[ ! -x "$HOME/.local/bin/uv" ]]; then
          curl -LsSf https://astral.sh/uv/install.sh | sh
        fi


    - name: Prepare build directory
      shell: bash
      env:
        MKOSI_BUILD_DIR: ${{ github.workspace }}/../imgbuild
        CONF_SRC: ${{ github.action_path }}/conf
      run: |
        mkdir -p "$MKOSI_BUILD_DIR"
        cp -a "$CONF_SRC"/. "$MKOSI_BUILD_DIR/"

    - name: Build raw image
      shell: bash
      working-directory: ${{ github.workspace }}/../imgbuild
      env:
        KERNEL_INSTALL_DIR: ${{ inputs.kernel_dir }}
      run: |
        "$HOME/.local/bin/uv" tool run \
          --from git+https://github.com/systemd/mkosi.git#9a28ad20bbea61894ea7b971d318a71f4374cf3b \
          mkosi --force --build-sources="$KERNEL_INSTALL_DIR:/kernel-install"

    - name: Resize image
      shell: bash
      working-directory: ${{ github.workspace }}/../imgbuild
      env:
        RAW_IMAGE: image.raw
      run: bash "${{ github.action_path }}/resize.sh"

    - name: Convert to VHD
      shell: bash
      working-directory: ${{ github.workspace }}/../imgbuild
      env:
        OUTPUT_NAME: ${{ inputs.output_name }}
      run: |
        qemu-img convert -f raw -o subformat=fixed,force_size -O vpc \
          image.raw \
          "$OUTPUT_NAME.vhd"

    - name: Resolve output paths
      id: paths
      shell: bash
      env:
        OUTPUT_NAME: ${{ inputs.output_name }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        IMGBUILD="$(realpath "$WORKSPACE/../imgbuild")"
        echo "image_raw=$IMGBUILD/image.raw" >> "$GITHUB_OUTPUT"
        echo "image_vhd=$IMGBUILD/$OUTPUT_NAME.vhd" >> "$GITHUB_OUTPUT"
