name: Distro image packager
description: Package pre-built kernel artifacts into a distro image using mkosi

inputs:
  kernel_dir:
    description: Path to the kernel install directory containing boot/ and lib/modules/
    required: true
  distro:
    description: Distribution base
    required: false
    default: "centos"
  output_name:
    description: Base filename for output image (without extension)
    required: false
    default: "image"
  extra_packages:
    description: Additional packages to install in the image (space-separated)
    required: false
    default: ""

outputs:
  image_path:
    description: Path to the generated VHD image file
    value: ${{ github.workspace }}/${{ inputs.output_name }}.vhd

runs:
  using: "composite"
  steps:
    - name: Install image build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y dnf rpm qemu-utils jq distribution-gpg-keys

    - name: Disable AppArmor userns restriction
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - name: Cache uv and mkosi
      uses: actions/cache@v4
      id: uv-cache
      with:
        path: |
          ~/.local/bin/uv
          ~/.local/bin/uvx
          ~/.local/share/uv
        key: uv-mkosi-${{ runner.os }}

    - name: Install uv
      shell: bash
      run: |
        if ! command -v uv &>/dev/null && [[ ! -x "$HOME/.local/bin/uv" ]]; then
          curl -LsSf https://astral.sh/uv/install.sh | sh
        fi

    - name: Add uv to PATH
      shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Cache mkosi tools and packages
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/../imgbuild/mkosi.cache
          ${{ github.workspace }}/../imgbuild/mkosi.tools
          ${{ github.workspace }}/../imgbuild/mkosi.pkgcache
        key: mkosi-${{ inputs.distro }}-${{ runner.os }}

    - name: Prepare build directory
      shell: bash
      env:
        MKOSI_BUILD_DIR: ${{ github.workspace }}/../imgbuild
        CONF_SRC: ${{ github.action_path }}/conf
      run: |
        mkdir -p "$MKOSI_BUILD_DIR"
        cp -a "$CONF_SRC"/. "$MKOSI_BUILD_DIR/"

    - name: Build raw image
      shell: bash
      working-directory: ${{ github.workspace }}/../imgbuild
      env:
        KERNEL_INSTALL_DIR: ${{ inputs.kernel_dir }}
      run: |
        "$HOME/.local/bin/uv" tool run \
          --from git+https://github.com/systemd/mkosi.git#9a28ad20bbea61894ea7b971d318a71f4374cf3b \
          mkosi --force --build-sources="$KERNEL_INSTALL_DIR:/kernel-install"

    - name: Resize image
      shell: bash
      working-directory: ${{ github.workspace }}/../imgbuild
      run: bash "${{ github.action_path }}/resize.sh"

    - name: Convert to VHD
      shell: bash
      working-directory: ${{ github.workspace }}/../imgbuild
      run: |
        qemu-img convert -f raw -o subformat=fixed,force_size -O vpc \
          image.raw \
          "${{ github.workspace }}/${{ inputs.output_name }}.vhd"

    - name: Detect kernel version
      id: kver
      shell: bash
      run: |
        KVER=$(basename "$(ls -d "${{ inputs.kernel_dir }}/lib/modules/"*/)" )
        echo "version=$KVER" >> "$GITHUB_OUTPUT"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.kver.outputs.version }}
        path: |
          ${{ github.workspace }}/${{ inputs.output_name }}.vhd
          ${{ inputs.kernel_dir }}/
