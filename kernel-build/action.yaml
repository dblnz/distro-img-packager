name: Kernel builder
description: Build a Linux kernel from source and output vmlinuz and modules

inputs:
  kernel_src:
    description: Path to a directory containing the kernel source tree
    required: true
  kernel_config:
    description: Path to kernel config fragment merged on top of the base config
    required: false
    default: ""
  kernel_config_extra:
    description: Inline kernel config options (highest priority, merged last). One CONFIG_* per line.
    required: false
    default: ""
  custom_label:
    description: Custom label appended to the kernel version string
    required: false
    default: ""

outputs:
  kernel_dir:
    description: Path to the kernel install directory containing boot/ and lib/modules/
    value: ${{ steps.kver.outputs.kernel_dir }}
  kernel_version:
    description: Full kernel version string
    value: ${{ steps.kver.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc make flex bison \
          libssl-dev libelf-dev \
          bc perl diffutils git ccache

    - name: Build kernel
      shell: bash
      working-directory: ${{ inputs.kernel_src }}
      env:
        KERNEL_CONFIG_EXTRA: ${{ inputs.kernel_config_extra }}
      run: |
        # Generate minimal base config
        make defconfig

        # Merge user-provided config fragment on top of base config
        if [[ -n "${{ inputs.kernel_config }}" && -f "${{ inputs.kernel_config }}" ]]; then
          scripts/kconfig/merge_config.sh -m .config "${{ inputs.kernel_config }}"
        fi

        # Merge inline config options (highest priority)
        if [[ -n "$KERNEL_CONFIG_EXTRA" ]]; then
          INLINE_FRAGMENT=$(mktemp)
          trap 'rm -f "$INLINE_FRAGMENT"' EXIT
          printf '%s\n' "$KERNEL_CONFIG_EXTRA" > "$INLINE_FRAGMENT"
          scripts/kconfig/merge_config.sh -m .config "$INLINE_FRAGMENT"
          rm -f "$INLINE_FRAGMENT"
          trap - EXIT
        fi

        make olddefconfig

        # Annotate kernel version: {version}-<actor>-<label>-<commit_hash>
        COMMIT_SHORT="${{ github.sha }}"
        COMMIT_SHORT="${COMMIT_SHORT:0:7}"
        LABEL_PARTS="${{ github.actor }}"
        if [[ -n "${{ inputs.custom_label }}" ]]; then
          LABEL_PARTS="${LABEL_PARTS}-${{ inputs.custom_label }}"
        fi
        LOCALVERSION="-${LABEL_PARTS}-${COMMIT_SHORT}"
        scripts/config --set-str CONFIG_LOCALVERSION "$LOCALVERSION"
        make olddefconfig

        # disable build timestamp for reproducible builds and ccache efficiency
        export KBUILD_BUILD_TIMESTAMP=""
        make CC="ccache gcc" bzImage -j"$(nproc)"
        make CC="ccache gcc" modules -j"$(nproc)"

    - name: Install kernel to staging directory
      shell: bash
      working-directory: ${{ inputs.kernel_src }}
      env:
        KERNEL_INSTALL_DIR: ${{ github.workspace }}/../imgbuild/kernel-install
      run: |
        rm -rf "$KERNEL_INSTALL_DIR"
        mkdir -p "$KERNEL_INSTALL_DIR"
        make modules_install INSTALL_MOD_PATH="$KERNEL_INSTALL_DIR"
        make install INSTALL_PATH="$KERNEL_INSTALL_DIR/boot" INSTALLKERNEL=no

    - name: Detect kernel version
      id: kver
      shell: bash
      env:
        KERNEL_INSTALL_DIR: ${{ github.workspace }}/../imgbuild/kernel-install
      run: |
        RESOLVED_DIR="$(realpath "$KERNEL_INSTALL_DIR")"
        KVER=$(basename "$(ls -d "$RESOLVED_DIR/lib/modules/"*/)" )
        echo "version=$KVER" >> "$GITHUB_OUTPUT"
        echo "kernel_dir=$RESOLVED_DIR" >> "$GITHUB_OUTPUT"
