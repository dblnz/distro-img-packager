name: Test image build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout action
        uses: actions/checkout@v4

      - name: Checkout kernel sources
        run: |
          git clone --depth 1 --branch v7.0.4 https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git linux

      - name: Build image
        uses: ./
        id: build
        with:
          kernel_dir: linux

      - name: Verify output
        run: |
          ls -lh "${{ steps.build.outputs.image_path }}"
          qemu-img info "${{ steps.build.outputs.image_path }}"
