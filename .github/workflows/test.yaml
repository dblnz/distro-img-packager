name: Test image build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on:
      - "self-hosted"
      - "ubuntu"
    steps:
      - name: Checkout action
        uses: actions/checkout@v4

      - name: Install QEMU for boot test
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf genisoimage

      - name: Cache kernel source
        uses: actions/cache@v4
        id: kernel-cache
        with:
          path: linux
          key: kernel-stable-v7.0.4

      - name: Clone kernel source
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch "v7.0.4" \
            "https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git" linux

      - name: Build kernel
        uses: ./kernel-build
        id: kernel
        with:
          kernel_src: ${{ github.workspace }}/linux
          kernel_config: ${{ github.workspace }}/test-kernel-extra.config
          kernel_config_extra: |
            # CONFIG_EFI_SBAT_FILE is not set
            # CONFIG_DEBUG_INFO is not set
            CONFIG_XFS_FS=y
          custom_label: "test"

      - name: Build image
        uses: ./
        id: build
        with:
          kernel_dir: ${{ steps.kernel.outputs.kernel_dir }}

      - name: Verify output
        run: |
          ls -lh "${{ steps.build.outputs.image_path }}"
          qemu-img info "${{ steps.build.outputs.image_path }}"

      - name: Boot image and verify kernel version
        run: |
          COMMIT_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          EXPECTED_KVER="7.0.4-${{ github.actor }}-test-${COMMIT_SHORT}"
          IMAGE="${{ steps.build.outputs.image_path }}"
          SERIAL_LOG=$(mktemp)
          OVMF_VARS=$(mktemp)
          RAW_IMAGE=$(mktemp)

          # Discover OVMF firmware
          OVMF_CODE=""
          for f in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd; do
            if [[ -f "$f" ]]; then
              OVMF_CODE="$f"
              break
            fi
          done
          for f in /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd; do
            if [[ -f "$f" ]]; then
              cp "$f" "$OVMF_VARS"
              break
            fi
          done
          if [[ -z "$OVMF_CODE" ]]; then
            echo "ERROR: OVMF firmware not found"
            exit 1
          fi

          # Create cloud-init NoCloud seed ISO with a test user
          SEED_DIR=$(mktemp -d)
          SEED_ISO=$(mktemp --suffix=.iso)
          cat > "$SEED_DIR/meta-data" <<EOF
          instance-id: test-boot
          local-hostname: test-vm
          EOF
          cat > "$SEED_DIR/user-data" <<'EOF'
          #cloud-config
          users:
            - name: testuser
              plain_text_passwd: testpass
              lock_passwd: false
              shell: /bin/bash
          runcmd:
            - echo "UNAME_OUTPUT=$(uname -r)" > /dev/ttyS0
            - poweroff
          EOF
          genisoimage -output "$SEED_ISO" -volid cidata -joliet -rock \
            "$SEED_DIR/user-data" "$SEED_DIR/meta-data" 2>/dev/null
          rm -rf "$SEED_DIR"

          qemu-img convert -f vpc -O raw "$IMAGE" "$RAW_IMAGE"

          timeout 120 qemu-system-x86_64 \
            -machine q35 \
            -m 2048 \
            -display none \
            -monitor none \
            -serial file:"$SERIAL_LOG" \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file="$OVMF_VARS" \
            -drive file="$RAW_IMAGE",format=raw,if=virtio \
            -drive file="$SEED_ISO",format=raw,if=virtio \
            -enable-kvm \
            -cpu host \
            -no-reboot &
          QEMU_PID=$!

          for i in $(seq 1 60); do
            if grep -q "UNAME_OUTPUT=" "$SERIAL_LOG" 2>/dev/null; then
              echo "cloud-init completed after ~$((i*2))s"
              break
            fi
            sleep 2
          done

          sleep 5
          kill $QEMU_PID 2>/dev/null || true
          wait $QEMU_PID 2>/dev/null || true

          echo "=== Serial console output ==="
          cat "$SERIAL_LOG"
          echo "=== End serial console output ==="

          BOOT_OK=true
          if ! grep -q "Linux version ${EXPECTED_KVER}" "$SERIAL_LOG"; then
            echo "==> ❌ Expected kernel version ${EXPECTED_KVER} not found in boot log"
            BOOT_OK=false
          fi

          if ! grep -q "UNAME_OUTPUT=${EXPECTED_KVER}" "$SERIAL_LOG"; then
            echo "==> ❌ uname -r did not report expected version ${EXPECTED_KVER}"
            BOOT_OK=false
          fi

          if grep -q "Freezing execution" "$SERIAL_LOG"; then
            echo "==> ❌ systemd failed to initialize (Freezing execution detected)"
            BOOT_OK=false
          fi

          if grep -q "Failed to allocate manager object" "$SERIAL_LOG"; then
            echo "==> ❌ systemd failed to allocate manager object"
            BOOT_OK=false
          fi

          if [[ "$BOOT_OK" == "true" ]]; then
            echo "==> ✅ Kernel version ${EXPECTED_KVER} confirmed via uname -r, system booted successfully"
          else
            rm -f "$SERIAL_LOG" "$OVMF_VARS" "$RAW_IMAGE" "$SEED_ISO"
            exit 1
          fi

          rm -f "$SERIAL_LOG" "$OVMF_VARS" "$RAW_IMAGE" "$SEED_ISO"
